<!DOCTYPE html>
<html>
<!--
  The panel. It has two parts: a one-line status, and a WebView that shows the tool
  running at http://localhost:3000 (the Next.js app in ../web). All the interface lives
  in the web app. This file and index.js only host it and talk to Photoshop.
  The address must match "requiredPermissions.webview.domains" in manifest.json.
-->
<head>
  <style>
    body { margin: 0; padding: 0; background-color: #0a0a0a; color: #d6d3d1; font-family: sans-serif; }
    .shell { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
    #status { flex: 0 0 auto; display: flex; flex-direction: row; align-items: center; padding: 6px 10px; font-size: 11px; color: #a8a29e; }
    #dot { width: 6px; height: 6px; border-radius: 3px; margin-right: 6px; background-color: #e6b450; }
    #dot.on { background-color: #5fbf8a; }
    #view { flex: 1 1 auto; }
  </style>
</head>

<body>
  <div class="shell">
    <div id="status">
      <div id="dot"></div>
      <span id="statusText">Waiting for the tool at localhost:3000</span>
    </div>
    <webview id="view" src="http://localhost:3000" width="100%" height="100%" uxpAllowInspector="true"></webview>
  </div>
  <script src="index.js"></script>
</body>

</html>
